<!DOCTYPE html>
{% include head.html %}
<body class="hexfull">
	{% include navbar.html active="shop" %}
	<div class="open-shop-button">
		<button class="slotbutton" onclick="openShop()">Secret Shop</button>
	</div>
	<div class="shop-content" hidden=true>
		<h1> Secret Shop </h1>
		<div id="error-message"></div>
		<h2> Legendary Items </h2>
		<div class="shopbox2">
			<div class="moba-item">
				<img draggable=false class="Item: Diamond Sword" onclick="buyMobaItem('Diamond Sword')" src="assets/img/Items2/Diamond Sword.png" style="width:64px;height:64px;">
				<span class="tooltiptext">
					<h1> (350) Diamond Sword </h1>
					<p> From Minecraf. </p>
				</span>
			</div>

			<div class="moba-item">
				<img draggable=false class="Item: Bad Time" onclick="buyMobaItem('Bad Time')" src="assets/img/Items2/Bad Time.png" style="width:64px;height:64px;">
				<span class="tooltiptext">
					<h1> (200) Bad Time </h1>
					<p> Changes the slot machine music for 10 minutes. </p>
				</span>
			</div>

			<div class="moba-item">
				<img draggable=false class="Item: Lovey Dovey" onclick="buyMobaItem('Lovey Dovey')" src="assets/img/Items2/Lovey Dovey.png" style="width:64px;height:64px;">
				<span class="tooltiptext">
					<h1> (250) Lovey Dovey </h1>
					<p> All minions have double health for 5 minutes. </p>
				</span>
			</div>
		</div>
	</div>
</body>
<script>var Music = new Audio("assets/audio/Secret Shop.mp3");</script>
<script src="button.js"></script>
<script>
updateShop2()
</script>
<script src="music.js"></script>
